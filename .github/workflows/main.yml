name: Windows RDP US (Free Utility)
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: false
        default: ''
      user_name:
        description: 'Discord User Name'
        required: false
        default: ''
      bot_token:
        description: 'Discord Bot Token'
        required: false
        default: ''

jobs:
  launch-rdp:
    runs-on: windows-2025
    steps:
      - name: 1. Bat RDP & Tao User Zetvm
        shell: cmd
        run: |
          net user Zetvm "Zetstore@22" /add
          net localgroup administrators Zetvm /add
          net localgroup "Remote Desktop Users" Zetvm /add
          net user Zetvm "Zetstore@22"
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v MaxInstanceCount /t REG_DWORD /d 10 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v SelectTransport /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fDisableUDP /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services\Client" /v fClientDisableUDP /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveInterval /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveTimeout /t REG_DWORD /d 0 /f
          rem Bat 32-bit True Color va Font Smoothing tren RDP cho ro net tuyet doi
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v ColorDepth /t REG_DWORD /d 4 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v ColorDepth /t REG_DWORD /d 4 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fAllowDesktopComposition /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fAllowFontSmoothing /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fDisableRemoteEffects /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          echo Da tao thanh cong tai khoan Zetvm tren Windows Server 2025!

      - name: 2. Cai dat Hinh Nen Zet Store 2K Sieu Net, Discord, Roblox, Bloxstrap & StarDesk
        shell: powershell
        run: |
          $publicDesktop = "C:\Users\Public\Desktop"
          $userDesktop = "C:\Users\Zetvm\Desktop"
          New-Item -ItemType Directory -Force -Path $publicDesktop | Out-Null
          New-Item -ItemType Directory -Force -Path $userDesktop | Out-Null

          # 1. Don dep sach se cac ung dung, shortcut khong can thiet cho do vuong
          Write-Host "Dang don dep shortcut rac tren Desktop..."
          Get-ChildItem -Path $publicDesktop, $userDesktop -Recurse -Include *.lnk, *.url -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          # 2. Cai dat Hinh Nen Zet Store 2K Sieu Net (Khong bi mo)
          Write-Host "Dang cai dat Hinh Nen Zet Store 2K Sieu Net..."
          try {
            $wpJpg = "C:\wallpaper.jpg"
            $wpPng = "C:\wallpaper.png"
            Invoke-WebRequest -Uri "https://files.catbox.moe/gom3qu.jpg" -OutFile $wpJpg -UseBasicParsing
            Invoke-WebRequest -Uri "https://files.catbox.moe/izsqju.png" -OutFile $wpPng -UseBasicParsing
            
            # Ghi de hinh nen he thong img0.jpg voi ban 2K chat luong cao
            takeown /f "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /a 2>$null
            icacls "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /grant Administrators:F 2>$null
            Copy-Item $wpJpg "C:\Windows\Web\Wallpaper\Windows\img0.jpg" -Force -ErrorAction SilentlyContinue

            # Vo hieu hoa tinh nang nen anh JPEG cua Windows (Giu nguyen 100% chat luong goc, khong bi mo)
            reg add "HKEY_CURRENT_USER\Control Panel\Desktop" /v JPEGImportQuality /t REG_DWORD /d 100 /f
            reg add "HKEY_CURRENT_USER\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "$wpPng" /f
            reg add "HKEY_CURRENT_USER\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d "10" /f
            reg add "HKEY_CURRENT_USER\Control Panel\Desktop" /v TileWallpaper /t REG_SZ /d "0" /f
            reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\Personalization" /v LockScreenImage /t REG_SZ /d "$wpPng" /f
            reg add "HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\PersonalizationCSP" /v DesktopImagePath /t REG_SZ /d "$wpPng" /f

            # Cau hinh cho ca Default User (User moi tao Zetvm khi dang nhap)
            reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT" 2>$null
            reg add "HKU\DefaultUser\Control Panel\Desktop" /v JPEGImportQuality /t REG_DWORD /d 100 /f
            reg add "HKU\DefaultUser\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "$wpPng" /f
            reg add "HKU\DefaultUser\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d "10" /f
            reg add "HKU\DefaultUser\Control Panel\Desktop" /v TileWallpaper /t REG_SZ /d "0" /f
            reg unload "HKU\DefaultUser" 2>$null

            # Bat Che do lam min phong chu ClearType va Do phan giai cao cho RDP
            reg add "HKEY_CURRENT_USER\Control Panel\Desktop" /v FontSmoothing /t REG_SZ /d "2" /f
            reg add "HKEY_CURRENT_USER\Control Panel\Desktop" /v FontSmoothingType /t REG_DWORD /d 2 /f
            rundll32.exe user32.dll,UpdatePerUserSystemParameters 1, True
            Write-Host "Da cai dat Hinh Nen Zet Store 2K Sieu Net thanh cong!"
          } catch {
            Write-Host "Loi cai dat hinh nen: $_"
          }

          # 3. Tai Discord
          Write-Host "Dang tai Discord Setup..."
          try {
            Invoke-WebRequest -Uri "https://discord.com/api/download?platform=win" -OutFile "$publicDesktop\DiscordSetup.exe" -UseBasicParsing
            Copy-Item "$publicDesktop\DiscordSetup.exe" "$userDesktop\DiscordSetup.exe" -Force
          } catch {
            Write-Host "Loi tai Discord: $_"
          }

          # 4. Tai Roblox Player
          Write-Host "Dang tai Roblox Player Installer..."
          try {
            Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxPlayerInstaller.exe" -OutFile "$publicDesktop\RobloxPlayerInstaller.exe" -UseBasicParsing
            Copy-Item "$publicDesktop\RobloxPlayerInstaller.exe" "$userDesktop\RobloxPlayerInstaller.exe" -Force
            Start-Process -FilePath "$publicDesktop\RobloxPlayerInstaller.exe" -ArgumentList "/silent" -Wait -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Loi tai Roblox: $_"
          }

          # 5. Tai Bloxstrap
          Write-Host "Dang tai Bloxstrap (Ho tro treo Roblox multi-instance)..."
          try {
            Invoke-WebRequest -Uri "https://github.com/bloxstraplabs/bloxstrap/releases/download/v2.11.4/Bloxstrap-v2.11.4.exe" -OutFile "$publicDesktop\Bloxstrap.exe" -UseBasicParsing
            Copy-Item "$publicDesktop\Bloxstrap.exe" "$userDesktop\Bloxstrap.exe" -Force
          } catch {
            Write-Host "Loi tai Bloxstrap: $_"
          }

          # 6. Tai StarDesk
          Write-Host "Dang tai StarDesk..."
          try {
            Invoke-WebRequest -Uri "https://api.stardesk.net/api/v1/release/dl/1?channel=official" -OutFile "$publicDesktop\StarDesk.exe" -UseBasicParsing
            Copy-Item "$publicDesktop\StarDesk.exe" "$userDesktop\StarDesk.exe" -Force
            Start-Process -FilePath "$publicDesktop\StarDesk.exe" -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Loi tai StarDesk: $_"
          }

          # 7. Tao Tool Anti-AFK treo game
          Write-Host "Dang tao Tool Anti-AFK treo game..."
          $antiAfkScript = @"
          @echo off
          title ZET STORE - TOOL TREO GAME ANTI-AFK
          echo ================================================================
          echo       ZET STORE - TOOL HO TRO TREO GAME ROBLOX KHONG BI VANG
          echo ================================================================
          echo Dang giu may hoat dong chong disconnect 20 phut... Khong tat cua so nay!
          powershell -Command "Add-Type -AssemblyName System.Windows.Forms; while (`$true) { [System.Windows.Forms.SendKeys]::SendWait('{F15}'); Start-Sleep -Seconds 30 }"
          "@
          Set-Content -Path "$publicDesktop\Tool_Treo_Game_AntiAFK.bat" -Value $antiAfkScript
          Copy-Item "$publicDesktop\Tool_Treo_Game_AntiAFK.bat" "$userDesktop\Tool_Treo_Game_AntiAFK.bat" -Force

          # 8. Cai dat Sunshine (Host cho Moonlight Game Streaming)
          Write-Host "Dang cai dat Sunshine (Host cho Moonlight)..."
          try {
            $sunshineZip = "C:\sunshine.zip"
            $sunshineDir = "C:\Sunshine"
            Invoke-WebRequest -Uri "https://github.com/LizardByte/Sunshine/releases/download/v2026.914.233613/Sunshine-Windows-AMD64-lite.zip" -OutFile $sunshineZip -UseBasicParsing
            
            # Giai nen vao thu muc tam va chuyen sach ve C:\Sunshine (Tranh bi long thu muc C:\Sunshine\Sunshine)
            Expand-Archive -Path $sunshineZip -DestinationPath "C:\sunshine_temp" -Force
            New-Item -ItemType Directory -Force -Path $sunshineDir | Out-Null
            Copy-Item -Path "C:\sunshine_temp\Sunshine\*" -Destination $sunshineDir -Recurse -Force
            Remove-Item -Path "C:\sunshine_temp" -Recurse -Force -ErrorAction SilentlyContinue

            # Tao config va copy san file apps.json de Sunshine khoi dong khong bao gio loi
            New-Item -ItemType Directory -Force -Path "$sunshineDir\config" | Out-Null
            if (Test-Path "$sunshineDir\assets\apps.json") {
              Copy-Item "$sunshineDir\assets\apps.json" "$sunshineDir\config\apps.json" -Force
            }
            Set-Content -Path "$sunshineDir\config\sunshine.conf" -Value "port = 47989`norigin_pin_allowed = pc`nmin_log_level = info"

            # Tao Shortcut tren Desktop co WorkingDirectory chuan xac
            $WshShell = New-Object -ComObject WScript.Shell
            $Shortcut = $WshShell.CreateShortcut("$publicDesktop\Sunshine (Moonlight Host).lnk")
            $Shortcut.TargetPath = "$sunshineDir\sunshine.exe"
            $Shortcut.WorkingDirectory = "$sunshineDir"
            $Shortcut.Save()
            Copy-Item "$publicDesktop\Sunshine (Moonlight Host).lnk" "$userDesktop\Sunshine (Moonlight Host).lnk" -Force -ErrorAction SilentlyContinue

            # Tao Shortcut Web UI nhap ma PIN
            $PinShortcut = $WshShell.CreateShortcut("$publicDesktop\Sunshine Pairing (PIN).lnk")
            $PinShortcut.TargetPath = "https://localhost:47990"
            $PinShortcut.WorkingDirectory = "$sunshineDir"
            $PinShortcut.Save()
            Copy-Item "$publicDesktop\Sunshine Pairing (PIN).lnk" "$userDesktop\Sunshine Pairing (PIN).lnk" -Force -ErrorAction SilentlyContinue

            # Khoi chay Sunshine trong dung WorkingDirectory
            Start-Process -FilePath "$sunshineDir\sunshine.exe" -WorkingDirectory "$sunshineDir" -WindowStyle Minimized -ErrorAction SilentlyContinue
            Write-Host "Da khoi dong Sunshine Host cho Moonlight thanh cong!"
          } catch {
            Write-Host "Loi cai dat Sunshine: $_"
          }

          # 9. Bat Windows Audio Service (Fix loi Roblox bi crash tren Windows Server)
          Write-Host "Dang bat Windows Audio Service cho Roblox..."
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue
          Set-Service -Name AudioEndpointBuilder -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name AudioEndpointBuilder -ErrorAction SilentlyContinue

          # 10. Tao Tool Chuyen Console de treo Roblox khong bi vang khi dong RDP
          $disconnectScript = @"
          @echo off
          title ZET STORE - TREO ROBLOX KHONG BI VANG KHI DONG RDP
          echo ================================================================
          echo    DANG CHUYEN PHIEN LAM VIEC DE ROBLOX CHAY NGAM KHONG BI DIS
          echo ================================================================
          for /f "skip=1 tokens=3" %%s in ('query user %USERNAME%') do (
            %windir%\System32\tscon.exe %%s /dest:console
          )
          "@
          Set-Content -Path "$publicDesktop\Treo_Roblox_Khong_Vang.bat" -Value $disconnectScript
          Copy-Item "$publicDesktop\Treo_Roblox_Khong_Vang.bat" "$userDesktop\Treo_Roblox_Khong_Vang.bat" -Force
          Write-Host "Da cai dat xong toan bo ung dung can thiet len Desktop!"

      - name: 3. Ket noi Tunnel US & Gui DM Discord
        shell: bash
        run: |
          set +e
          RDP_HOST=""
          MOONLIGHT_HOST=""

          echo "Dang ket noi Bore Public Tunnel (May chu US - Cap IP RDP va IP Moonlight)..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip -o bore.zip
          unzip -q -o bore.zip
          
          # Mo tunnel cho RDP (Port 3389)
          ./bore.exe local 3389 --to bore.pub > bore_rdp.log 2>&1 &

          # Mo tunnel rieng cho Moonlight / Sunshine (Port 47989)
          ./bore.exe local 47989 --to bore.pub > bore_moonlight.log 2>&1 &
          
          for i in {1..20}; do
            sleep 2
            if [ -f bore_rdp.log ] && [ -z "$RDP_HOST" ]; then
              PORT=$(grep -oE 'listening at bore.pub:[0-9]+' bore_rdp.log 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
              if [ -n "$PORT" ]; then
                RDP_HOST="bore.pub:$PORT"
              fi
            fi
            if [ -f bore_moonlight.log ] && [ -z "$MOONLIGHT_HOST" ]; then
              ML_PORT=$(grep -oE 'listening at bore.pub:[0-9]+' bore_moonlight.log 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
              if [ -n "$ML_PORT" ]; then
                MOONLIGHT_HOST="bore.pub:$ML_PORT"
              fi
            fi
            if [ -n "$RDP_HOST" ] && [ -n "$MOONLIGHT_HOST" ]; then
              break
            fi
          done

          if [ -z "$RDP_HOST" ]; then
            echo "Khong lay duoc dia chi RDP Host!"
            exit 1
          fi
          if [ -z "$MOONLIGHT_HOST" ]; then
            MOONLIGHT_HOST="bore.pub:47989"
          fi

          echo "================================================================================"
          echo "🖥️ THONG TIN KET NOI WINDOWS SERVER 2025 (US):"
          echo "RDP_HOST: $RDP_HOST"
          echo "MOONLIGHT_HOST: $MOONLIGHT_HOST"
          echo "USER: Zetvm"
          echo "PASS: Zetstore@22"
          echo "OS: Windows Server 2025"
          echo "REGION: United States (US - Co the hoi lag vi server My)"
          echo "================================================================================"

          echo "### 🖥️ MÁY ẢO WINDOWS SERVER 2025 (US) ĐÃ SẴN SÀNG!" >> $GITHUB_STEP_SUMMARY
          echo "- 📍 **Địa chỉ IP RDP (Mstsc)**: \`$RDP_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🎮 **Địa chỉ IP Moonlight (Roblox)**: \`$MOONLIGHT_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 **Tên đăng nhập (Username)**: \`Zetvm\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔑 **Mật khẩu (Password)**: \`Zetstore@22\`" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ **Hệ điều hành**: Windows Server 2025" >> $GITHUB_STEP_SUMMARY
          echo "- 🎮 **Game & Tools**: Discord, Roblox, Bloxstrap, StarDesk, Sunshine, Anti-AFK" >> $GITHUB_STEP_SUMMARY
          echo "- 🖼️ **Hình nền**: Zet Store Official Wallpaper (2K Sieu Net)" >> $GITHUB_STEP_SUMMARY
          echo "- 🌏 **Khu vực**: United States (US - Miễn phí, hơi lag)" >> $GITHUB_STEP_SUMMARY

          USER_ID="${{ github.event.inputs.user_id }}"
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"

          if [ -n "$USER_ID" ] && [ -n "$BOT_TOKEN" ]; then
            echo "Dang tao kenh DM cho $USER_ID..."
            jq -n --arg uid "$USER_ID" '{"recipient_id": $uid}' > dm_req.json
            DM_RESP=$(curl -s -X POST "https://discord.com/api/v10/users/@me/channels" \
              -H "Authorization: Bot $BOT_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @dm_req.json)
            DM_CHANNEL=$(echo "$DM_RESP" | jq -r '.id // empty')

            if [ -n "$DM_CHANNEL" ] && [ "$DM_CHANNEL" != "null" ]; then
              echo "Dang gui thong tin RDP va Moonlight vao DM $DM_CHANNEL..."
              jq -n \
                --arg host "$RDP_HOST" \
                --arg ml_host "$MOONLIGHT_HOST" \
                --arg uid "$USER_ID" \
                '{
                  embeds: [{
                    title: "🖥️ MÁY ẢO WINDOWS SERVER 2025 ĐÃ SẴN SÀNG!",
                    description: ("Xin chào <@" + $uid + ">!\n\nMáy ảo **Windows Server 2025 (Khu vực US)** của bạn đã sẵn sàng!\n*Lưu ý: Do máy chủ đặt tại Mỹ (US) và là tiện ích miễn phí nên có thể sẽ hơi lag một chút.*\n\n📌 **Cách kết nối:**\n• **Dùng Remote Desktop (mstsc):** Dùng IP RDP bên dưới.\n• **Dùng Moonlight (Chơi/Treo Roblox không văng):** Dùng IP Moonlight bên dưới kết nối vào Sunshine (hoặc dùng StarDesk có sẵn trên máy)!"),
                    color: 3066993,
                    fields: [
                      { name: "📍 Địa chỉ IP RDP (Mstsc)", value: ("```" + $host + "```"), inline: true },
                      { name: "🎮 Địa chỉ IP Moonlight (Roblox)", value: ("```" + $ml_host + "```"), inline: true },
                      { name: "👤 Tên đăng nhập (Username)", value: "```Zetvm```", inline: true },
                      { name: "🔑 Mật khẩu (Password)", value: "```Zetstore@22```", inline: true },
                      { name: "🎮 Đã cài sẵn trên Desktop", value: "Discord, Roblox, Bloxstrap, StarDesk, Sunshine (Moonlight Host), Tool Treo Game", inline: false },
                      { name: "🖼️ Hình nền Desktop", value: "Đã cài đặt hình nền 2K độc quyền Zet Store (Siêu nét)", inline: false },
                      { name: "🌏 Khu vực & Hệ điều hành", value: "United States (US) • Windows Server 2025", inline: false }
                    ],
                    footer: { text: "Zet Store • Dịch vụ Windows RDP & Moonlight Cloud Gaming" }
                  }]
                }' > payload.json

              curl -s -X POST "https://discord.com/api/v10/channels/$DM_CHANNEL/messages" \
                -H "Authorization: Bot $BOT_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @payload.json
              echo "Da gui thong tin RDP va Moonlight thanh cong vao DMs!"
            else
              echo "Loi tao kenh DM: $DM_RESP"
            fi
          fi

          echo "Windows Server 2025 dang hoat dong on dinh..."
          for i in {1..360}; do
            sleep 60
            echo "May RDP da hoat dong duoc $i phut..."
          done
