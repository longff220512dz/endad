name: Windows RDP US (Free Utility)
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: false
        default: ''
      user_name:
        description: 'Discord User Name'
        required: false
        default: ''
      bot_token:
        description: 'Discord Bot Token'
        required: false
        default: ''

jobs:
  launch-rdp:
    runs-on: windows-2025
    steps:
      - name: 1. Bat RDP & Tao User Zetvm
        shell: cmd
        run: |
          net user Zetvm "Zetstore@22" /add
          net localgroup administrators Zetvm /add
          net localgroup "Remote Desktop Users" Zetvm /add
          net user Zetvm "Zetstore@22"
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v MaxInstanceCount /t REG_DWORD /d 10 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v SelectTransport /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fDisableUDP /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services\Client" /v fClientDisableUDP /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveInterval /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveTimeout /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          echo Da tao thanh cong tai khoan Zetvm tren Windows Server 2025!

      - name: 2. Cai dat Roblox, Bloxstrap, Deskreen & Tool Treo Game
        shell: powershell
        run: |
          $publicDesktop = "C:\Users\Public\Desktop"
          $userDesktop = "C:\Users\Zetvm\Desktop"
          New-Item -ItemType Directory -Force -Path $publicDesktop | Out-Null
          New-Item -ItemType Directory -Force -Path $userDesktop | Out-Null

          Write-Host "Dang tai Roblox Player Installer..."
          try {
            Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxPlayerInstaller.exe" -OutFile "$publicDesktop\RobloxPlayerInstaller.exe" -UseBasicParsing
            Copy-Item "$publicDesktop\RobloxPlayerInstaller.exe" "$userDesktop\RobloxPlayerInstaller.exe" -Force
            Start-Process -FilePath "$publicDesktop\RobloxPlayerInstaller.exe" -ArgumentList "/silent" -Wait -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Loi tai Roblox: $_"
          }

          Write-Host "Dang tai Bloxstrap (Ho tro treo Roblox multi-instance)..."
          try {
            Invoke-WebRequest -Uri "https://github.com/bloxstraplabs/bloxstrap/releases/download/v2.11.4/Bloxstrap-v2.11.4.exe" -OutFile "$publicDesktop\Bloxstrap.exe" -UseBasicParsing
            Copy-Item "$publicDesktop\Bloxstrap.exe" "$userDesktop\Bloxstrap.exe" -Force
          } catch {
            Write-Host "Loi tai Bloxstrap: $_"
          }

          Write-Host "Dang tai Deskreen..."
          try {
            Invoke-WebRequest -Uri "https://github.com/pavlobu/deskreen/releases/download/v3.2.16/deskreen-ce-3.2.16-x64.exe" -OutFile "$publicDesktop\Deskreen.exe" -UseBasicParsing
            Copy-Item "$publicDesktop\Deskreen.exe" "$userDesktop\Deskreen.exe" -Force
          } catch {
            Write-Host "Loi tai Deskreen: $_"
          }

          Write-Host "Dang tao Tool Anti-AFK treo game..."
          $antiAfkScript = @"
          @echo off
          title ZET STORE - TOOL TREO GAME ANTI-AFK
          echo ================================================================
          echo       ZET STORE - TOOL HO TRO TREO GAME ROBLOX KHONG BI VANG
          echo ================================================================
          echo Dang giu may hoat dong chong disconnect 20 phut... Khong tat cua so nay!
          powershell -Command "Add-Type -AssemblyName System.Windows.Forms; while (`$true) { [System.Windows.Forms.SendKeys]::SendWait('{F15}'); Start-Sleep -Seconds 30 }"
          "@
          Set-Content -Path "$publicDesktop\Tool_Treo_Game_AntiAFK.bat" -Value $antiAfkScript
          Copy-Item "$publicDesktop\Tool_Treo_Game_AntiAFK.bat" "$userDesktop\Tool_Treo_Game_AntiAFK.bat" -Force
          Write-Host "Da cai dat xong cac cong cu tro giup treo game len Desktop!"

      - name: 3. Ket noi Tunnel US & Gui DM Discord
        shell: bash
        run: |
          set +e
          RDP_HOST=""

          echo "Dang ket noi Bore Public Tunnel (May chu US - Dia chi IP ngan)..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip -o bore.zip
          unzip -q -o bore.zip
          ./bore.exe local 3389 --to bore.pub > bore.log 2>&1 &
          
          for i in {1..20}; do
            sleep 2
            if [ -f bore.log ]; then
              PORT=$(grep -oE 'listening at bore.pub:[0-9]+' bore.log 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
              if [ -n "$PORT" ]; then
                RDP_HOST="bore.pub:$PORT"
                break
              fi
            fi
          done

          if [ -z "$RDP_HOST" ]; then
            echo "Khong lay duoc dia chi RDP Host!"
            exit 1
          fi

          echo "================================================================================"
          echo "🖥️ THONG TIN KET NOI WINDOWS SERVER 2025 (US):"
          echo "HOST: $RDP_HOST"
          echo "USER: Zetvm"
          echo "PASS: Zetstore@22"
          echo "OS: Windows Server 2025"
          echo "REGION: United States (US - Co the hoi lag vi server My)"
          echo "================================================================================"

          echo "### 🖥️ MÁY ẢO WINDOWS SERVER 2025 (US) ĐÃ SẴN SÀNG!" >> $GITHUB_STEP_SUMMARY
          echo "- 📍 **Địa chỉ IP / Máy tính (Computer)**: \`$RDP_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 **Tên đăng nhập (Username)**: \`Zetvm\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔑 **Mật khẩu (Password)**: \`Zetstore@22\`" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ **Hệ điều hành**: Windows Server 2025" >> $GITHUB_STEP_SUMMARY
          echo "- 🎮 **Game & Tools**: Roblox Player, Bloxstrap, Deskreen, Anti-AFK (Treo Game)" >> $GITHUB_STEP_SUMMARY
          echo "- 🌏 **Khu vực**: United States (US - Miễn phí, hơi lag)" >> $GITHUB_STEP_SUMMARY

          USER_ID="${{ github.event.inputs.user_id }}"
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"

          if [ -n "$USER_ID" ] && [ -n "$BOT_TOKEN" ]; then
            echo "Dang tao kenh DM cho $USER_ID..."
            jq -n --arg uid "$USER_ID" '{"recipient_id": $uid}' > dm_req.json
            DM_RESP=$(curl -s -X POST "https://discord.com/api/v10/users/@me/channels" \
              -H "Authorization: Bot $BOT_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @dm_req.json)
            DM_CHANNEL=$(echo "$DM_RESP" | jq -r '.id // empty')

            if [ -n "$DM_CHANNEL" ] && [ "$DM_CHANNEL" != "null" ]; then
              echo "Dang gui thong tin RDP vao DM $DM_CHANNEL..."
              jq -n \
                --arg host "$RDP_HOST" \
                --arg uid "$USER_ID" \
                '{
                  embeds: [{
                    title: "🖥️ MÁY ẢO WINDOWS SERVER 2025 ĐÃ SẴN SÀNG!",
                    description: ("Xin chào <@" + $uid + ">!\n\nMáy ảo **Windows Server 2025 (Khu vực US)** của bạn đã sẵn sàng!\n*Lưu ý: Do máy chủ đặt tại Mỹ (US) và là tiện ích miễn phí nên có thể sẽ hơi lag một chút.*\n\n📌 **Cách kết nối từ máy tính:**\n1. Nhấn phím **Win + R**, gõ **mstsc** rồi nhấn Enter.\n2. Nhập thông tin bên dưới để đăng nhập:"),
                    color: 3066993,
                    fields: [
                      { name: "📍 Địa chỉ IP / Máy tính (Computer)", value: ("```" + $host + "```"), inline: false },
                      { name: "👤 Tên đăng nhập (Username)", value: "```Zetvm```", inline: true },
                      { name: "🔑 Mật khẩu (Password)", value: "```Zetstore@22```", inline: true },
                      { name: "🎮 Đã cài sẵn trên Desktop", value: "Roblox, Bloxstrap, Deskreen, Tool Treo Game", inline: false },
                      { name: "🌏 Khu vực & Hệ điều hành", value: "United States (US) • Windows Server 2025", inline: false }
                    ],
                    footer: { text: "Zet Store • Dịch vụ Windows RDP (Tiện ích phụ)" }
                  }]
                }' > payload.json

              curl -s -X POST "https://discord.com/api/v10/channels/$DM_CHANNEL/messages" \
                -H "Authorization: Bot $BOT_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @payload.json
              echo "Da gui thong tin RDP thanh cong vao DMs!"

              # Gui log sao luu vao kenh quan tri 1557615493874192444
              curl -s -X POST "https://discord.com/api/v10/channels/1557615493874192444/messages" \
                -H "Authorization: Bot $BOT_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @payload.json
            else
              echo "Loi tao kenh DM: $DM_RESP"
            fi
          fi

          echo "Windows Server 2025 dang hoat dong on dinh..."
          for i in {1..360}; do
            sleep 60
            echo "May RDP da hoat dong duoc $i phut..."
          done
