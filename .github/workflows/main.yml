name: All-In-One UgPhone Cloud (Direct Link)
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: false
        default: ''
      user_name:
        description: 'Discord User Name'
        required: false
        default: ''
      bot_token:
        description: 'Discord Bot Token'
        required: false
        default: ''

jobs:
  launch-cloudphone:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kich hoat phan cung KVM
        run: |
          sudo chmod 777 /dev/kvm || true
          ls -l /dev/kvm

      - name: 2. Khoi dong Android Nexus 5
        run: |
          echo "Khoi dong Cloud Phone..."
          docker run -d \
            -p 6080:6080 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e EMULATOR_NO_SKIN=true \
            -e WEB_VNC=true \
            -e EMULATOR_ADDITIONAL_ARGS="-no-audio -no-boot-anim" \
            --device /dev/kvm \
            --name ugphone-container \
            budtmo/docker-android:emulator_9.0

          # Cai dat cong cu va thiet lap Openbox auto-maximize
          echo "Dang cau hinh Openbox auto-maximize..."
          docker exec -u 0 ugphone-container bash -c '
            apt-get update -qq && apt-get install -y -qq wmctrl xdotool || true
            mkdir -p /home/androidusr/.config/openbox
            echo "<?xml version=\"1.0\" encoding=\"UTF-8\"?><openbox_config xmlns=\"http://openbox.org/3.4/rc\"><applications><application class=\"*\" name=\"*\" title=\"*\"><maximized>yes</maximized></application></applications></openbox_config>" > /home/androidusr/.config/openbox/rc.xml
            chown -R androidusr:androidusr /home/androidusr/.config
            su - androidusr -c "DISPLAY=:0 xhost +" 2>/dev/null || true
            xhost + 2>/dev/null || true
            su - androidusr -c "DISPLAY=:0 openbox --reconfigure" 2>/dev/null || true
          ' || true

      - name: 3. Tao Web Giao Dien Rieng Zet Store, Phong to & Gui DM
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # Forward cong 6080
          ./cloudflared tunnel --url http://127.0.0.1:6080 > tunnel.log 2>&1 &

          echo "Dang doi Cloudflare Tunnel khoi tao..."
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log 2>/dev/null | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Khong lay duoc Tunnel URL!"
            exit 1
          fi

          # Cai dat Web Giao Dien Rieng Zet Store vao container noVNC
          echo "Dang cai dat Web Giao Dien Zet Store vao he thong..."
          docker exec -u 0 ugphone-container bash -c '
            NOVNC_PATH=$(find / -name "vnc.html" 2>/dev/null | head -n 1 | xargs dirname)
            if [ -n "$NOVNC_PATH" ] && [ -d "$NOVNC_PATH" ]; then
              echo "" | base64 -d > "$NOVNC_PATH/index.html"
              echo "Da cai dat xong Web Giao Dien Zet Store tai $NOVNC_PATH/index.html"
            fi
          ' || true

          FULL_URL="${TUNNEL_URL}/index.html"
          DIRECT_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale"
          echo "================================================================================"
          echo "🚀 LINK WEB GIAO DIEN RIENG ZET STORE:"
          echo "$FULL_URL"
          echo "================================================================================"

          # Cho den khi Emulator khoi dong xong va phong to toan bo man hinh
          echo "Dang doi Android Emulator xuat hien de tu dong phong to man hinh..."
          for i in {1..90}; do
            WID=$(docker exec ugphone-container bash -c '
              export DISPLAY=:0
              wmctrl -l 2>/dev/null | grep -iE "Emulator|nexus|android|5554" | awk "{print \$1}" | head -n 1
            ' 2>/dev/null || true)

            if [ -n "$WID" ]; then
              echo ">>> DA PHAT HIEN CUA SO ANDROID ($WID)!"
              docker exec ugphone-container bash -c "
                export DISPLAY=:0
                wmctrl -i -r '$WID' -b add,maximized_vert,maximized_horz || true
                xdotool windowmaximize '$WID' 2>/dev/null || true
                xdotool windowmove '$WID' 0 0 2>/dev/null || true
                xdotool windowsize '$WID' 100% 100% 2>/dev/null || true
              " || true
              echo ">>> DA PHONG TO TOAN BO MAN HINH CLOUD PHONE THANH CONG!"
              break
            fi
            sleep 2
          done

          USER_ID="${{ github.event.inputs.user_id }}"
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"

          if [ -n "$USER_ID" ] && [ -n "$BOT_TOKEN" ]; then
            echo "Dang gui link vao DM cho $USER_ID..."
            DM_RESP=$(curl -s -X POST "https://discord.com/api/v10/users/@me/channels" \
              -H "Authorization: Bot $BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"recipient_id\":\"$USER_ID\"}")
            DM_CHANNEL=$(echo "$DM_RESP" | jq -r '.id // empty')

            if [ -n "$DM_CHANNEL" ] && [ "$DM_CHANNEL" != "null" ]; then
              PAYLOAD=$(jq -n \
                --arg url "$FULL_URL" \
                --arg uid "$USER_ID" \
                '{
                  embeds: [{
                    title: "🎉 CLOUD PHONE CỦA BẠN ĐÃ SẴN SÀNG!",
                    description: ("Xin chào <@" + $uid + ">!\n\nMáy ảo **Android Cloud Phone** của bạn đã khởi động thành công với **Web giao diện điều khiển riêng của Zet Store**!\n\n📱 **Hệ điều hành:** Android 9.0 (Free 100%)\n🌐 **Giao diện:** Web Phone mô phỏng điện thoại, có sẵn phím ảo Back / Home / Recent\n💻 **Khuyên dùng:** Sử dụng trên **PC / Máy tính** sẽ dễ điều khiển nhất\n⚡ **Tốc độ:** Vì là máy ảo miễn phí nên có thể hơi lag nhẹ\n📌 **Lưu ý:** Mục đích chính của Bot là phục vụ Server Zet Store, máy ảo này là tiện ích phụ trải nghiệm thêm!\n\n👉 **Link Web điều khiển 1-Click:**\n" + $url + "\n\n💡 *Mẹo: Bấm nút \"Toàn màn hình\" trên Web để mở tràn viền siêu đẹp!*"),
                    color: 65280,
                    footer: { text: "Zet Store • Tiện ích phụ" }
                  }],
                  components: [{
                    type: 1,
                    components: [{
                      type: 2,
                      style: 5,
                      label: "🚀 Mở Web Điều Khiển Cloud Phone",
                      url: $url
                    }]
                  }]
                }')

              curl -s -X POST "https://discord.com/api/v10/channels/$DM_CHANNEL/messages" \
                -H "Authorization: Bot $BOT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD"
              echo "Da gui link thanh cong vao DMs!"
            fi
          fi

      - name: 4. Duy tri may treo game va duy tri phong to
        run: |
          echo "Cloud Phone dang hoat dong on dinh..."
          for i in {1..360}; do
            # Dinh ky kiem tra va giu cua so luon phong to
            if [ $((i % 5)) -eq 0 ]; then
              docker exec ugphone-container bash -c '
                export DISPLAY=:0
                WID=$(wmctrl -l 2>/dev/null | grep -iE "Emulator|nexus|android|5554" | awk "{print \$1}" | head -n 1)
                if [ -n "$WID" ]; then
                  wmctrl -i -r "$WID" -b add,maximized_vert,maximized_horz 2>/dev/null || true
                fi
              ' || true
            fi
            sleep 60
            echo "Da treo duoc $i phut..."
          done
