name: All-In-One UgPhone Cloud (Full Screen)
on:
  workflow_dispatch:

jobs:
  launch-cloudphone:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kich hoat phan cung KVM
        run: |
          sudo chmod 777 /dev/kvm || true
          ls -l /dev/kvm

      - name: 2. Khoi dong Android chay ngam
        run: |
          echo "Khoi dong Android Cloud Phone..."
          # Chay Android nhe nhang, khong can load giao dien VNC thua
          docker run -d \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e EMULATOR_NO_SKIN=true \
            -e WEB_VNC=true \
            -e EMULATOR_ADDITIONAL_ARGS="-no-audio -no-boot-anim" \
            --device /dev/kvm \
            --name ugphone-container \
            budtmo/docker-android:emulator_9.0

          # Cho Android khoi dong san sang
          sleep 20
          docker ps

      - name: 3. Kich hoat bo phat luong Tran Vien 100% (Scrcpy-Web)
        run: |
          echo "Ket noi ADB va khoi chay Scrcpy-Web..."
          sudo apt-get update && sudo apt-get install -y adb
          adb connect 127.0.0.1:5555
          
          # Chay Web Scrcpy tren cong 8000 (Khong vien, khong thanh tieu de)
          docker run -d \
            --name ws-scrcpy \
            --restart=always \
            --net=host \
            scavin/ws-scrcpy

          sleep 5

      - name: 4. Tao link Web HTTPS tu dong
        run: |
          # Tai Cloudflare Quick Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # Tro thang vao cong 8000 cua Scrcpy-Web (Tran vien 100%)
          ./cloudflared tunnel --url http://127.0.0.1:8000 > tunnel.log 2>&1 &

          # Cho lay link va in ra man hinh
          sleep 10
          echo "=========================================================="
          echo "🚀 LINK CLOUD PHONE TRAN VIEN 100% (CHUAN UGPHONE):"
          grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log | head -n 1
          echo "=========================================================="

      - name: 5. Duy tri may treo game
        run: |
          echo "Cloud Phone dang treo hoat dong lien tuc..."
          for i in {1..360}; do
            sleep 60
            echo "Da treo duoc $i phut..."
          done
