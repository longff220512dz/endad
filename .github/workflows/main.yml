name: All-In-One UgPhone Cloud
on:
  workflow_dispatch:

jobs:
  launch-cloudphone:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Toi uu he thong & Nap Kernel Android
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe binder_linux devices="binder,hwbinder,vndbinder" || true
          
          # Neu kernel thieu binder, build tu dong trong 20s
          if [ ! -e /dev/binder ]; then
            git clone https://github.com/remote-android/redroid-modules.git /tmp/redroid-modules
            cd /tmp/redroid-modules
            make && sudo insmod binder_linux.ko devices="binder,hwbinder,vndbinder"
          fi
          ls -la /dev/binder

      - name: 2. Khoi dong ReDroid Cloud Phone (Ho tro Game ARM)
        run: |
          # Chay ReDroid 11 voi bo dich ARM Translation cho Game & CPU Software Render
          docker run -itd \
            --name=ugphone \
            --privileged \
            --pull always \
            -v /data/cloudphone:/data \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.redroid_width=720 \
            androidboot.redroid_height=1280 \
            androidboot.redroid_dpi=320 \
            androidboot.redroid_fps=30 \
            androidboot.use_memfd=1 \
            ro.kernel.qemu.gles=0 \
            ro.setupwizard.mode=DISABLED

          # Cai dat adb va cho Android boot hoan tat
          sudo apt-get install -y adb
          adb connect 127.0.0.1:5555
          adb wait-for-device
          echo "Android da khoi dong thanh cong!"

      - name: 3. Cai dat Giao dien Web Scrcpy (Dieu khien tren dien thoai)
        run: |
          # Chay Web Client de vuot cam ung tren trinh duyet
          docker run -d \
            --name=scrcpy-web \
            --restart=always \
            --net=host \
            emptysuns/scrcpy-web:latest
          
          sleep 5

      - name: 4. Tao duong link Web truy cap tu xa (Cloudflare Tunnel)
        run: |
          # Tai Cloudflare Quick Tunnel (Mien phi, tao link HTTPS ngay lap tuc)
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          
          # Khoi chay tunnel tro vao cong 8000 cua Web Scrcpy
          ./cloudflared tunnel --url http://127.0.0.1:8000 > tunnel.log 2>&1 &
          
          # Cho tao link va in ra man hinh
          sleep 8
          echo "=========================================================="
          echo "🚀 LINK DIEU KHIEN CLOUD PHONE DUNG CHO DIEN THOAI & PC:"
          grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log | head -n 1
          echo "=========================================================="

      - name: 5. Giu Cloud Phone hoat dong treo game (Toi da 6 tieng)
        run: |
          echo "Cloud Phone dang treo hoat dong..."
          # Vong lap duy tri workflow chay lien tuc
          for i in {1..360}; do
            sleep 60
            echo "Da treo duoc $i phut..."
          done
