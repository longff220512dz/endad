name: Windows RDP Asia (Low Ping)
on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Ngrok Auth Token (Tuy chon - de dung Ngrok Asia 6 tieng)'
        required: false
        default: ''
      region:
        description: 'Ngrok Region (ap, jp, in, us, eu)'
        required: false
        default: 'ap'
      user_id:
        description: 'Discord User ID'
        required: false
        default: ''
      user_name:
        description: 'Discord User Name'
        required: false
        default: ''
      bot_token:
        description: 'Discord Bot Token'
        required: false
        default: ''

jobs:
  launch-rdp:
    runs-on: windows-latest
    steps:
      - name: 1. Bat RDP & Tao User Admin
        shell: powershell
        run: |
          echo "Dang bat dich vu Remote Desktop..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 0
          
          echo "Dang tao tai khoan runneradmin..."
          net user runneradmin "ZetStore@Asia2026!" /add
          net localgroup administrators runneradmin /add
          net user runneradmin "ZetStore@Asia2026!"
          echo "Da tao xong user runneradmin voi quyen Administrator!"

      - name: 2. Ket noi Tunnel Asia & Lay Thong Tin RDP
        shell: powershell
        run: |
          $ngrokToken = "${{ github.event.inputs.ngrok_token }}".Trim()
          $region = "${{ github.event.inputs.region }}".Trim()
          if (-not $region) { $region = "ap" }

          $rdpHost = ""

          if ($ngrokToken) {
            echo "Dang ket noi Ngrok Tunnel vung Asia ($region)..."
            curl.exe -sL "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -o "ngrok.zip"
            Expand-Archive -Path "ngrok.zip" -DestinationPath . -Force
            ./ngrok.exe config add-authtoken $ngrokToken
            Start-Process -FilePath "./ngrok.exe" -ArgumentList "tcp --region $region 3389" -WindowStyle Hidden
            
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              try {
                $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                $pubUrl = $resp.tunnels[0].public_url
                if ($pubUrl) {
                  $rdpHost = $pubUrl -replace "tcp://", ""
                  break
                }
              } catch {}
            }
          } else {
            echo "Khong co Ngrok Token, tu dong ket noi Pinggy Asia Server (ap.free.pinggy.io)..."
            $pingProc = Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp@ap.free.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -PassThru
            
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "pinggy.log") {
                $content = Get-Content "pinggy.log" -Raw
                if ($content -match "tcp://([a-zA-Z0-9\.\-]+:[0-9]+)") {
                  $rdpHost = $matches[1]
                  break
                }
              }
            }
          }

          if (-not $rdpHost) {
            echo "Khong lay duoc dia chi RDP Host!"
            exit 1
          }

          echo "================================================================================"
          echo "🖥️ THONG TIN KET NOI WINDOWS RDP ASIA:"
          echo "HOST: $rdpHost"
          echo "USER: zetngu"
          echo "PASS: Zetsito@123"
          echo "REGION: Asia (Singapore/Japan - Ping cuc thap)"
          echo "================================================================================"

          $userId = "${{ github.event.inputs.user_id }}".Trim()
          $botToken = "${{ github.event.inputs.bot_token }}".Trim()

          if ($userId -and $botToken) {
            echo "Dang gui thong tin RDP vao tin nhan rieng Discord cho $userId..."
            $dmChannelUrl = "https://discord.com/api/v10/users/@me/channels"
            $authHeader = @{
              "Authorization" = "Bot $botToken"
              "Content-Type" = "application/json"
            }
            $dmBody = @{ "recipient_id" = $userId } | ConvertTo-Json

            $dmResp = Invoke-RestMethod -Uri $dmChannelUrl -Method Post -Headers $authHeader -Body $dmBody
            $dmChannelId = $dmResp.id

            if ($dmChannelId) {
              $payload = @{
                embeds = @(@{
                  title = "🖥️ MÁY ẢO WINDOWS RDP ASIA ĐÃ SẴN SÀNG!"
                  description = "Xin chào <@$userId>!`n`nMáy ảo **Windows Server 2022** của bạn đã khởi động thành công với vị trí **Server Châu Á (Asia Pacific)** cho độ trễ cực thấp!`n`n📌 **Cách kết nối từ máy tính:**`n1. Nhấn phím `**`Win + R`**`, gõ `**`mstsc`**` rồi nhấn Enter.`n2. Nhập thông tin bên dưới để đăng nhập:"
                  color = 3066993
                  fields = @(
                    @{ name = "📍 Địa chỉ IP / Máy tính (Computer)"; value = "```$rdpHost```"; inline = $false },
                    @{ name = "👤 Tên đăng nhập (Username)"; value = "```runneradmin```"; inline = $true },
                    @{ name = "🔑 Mật khẩu (Password)"; value = "```ZetStore@Asia2026!```"; inline = $true },
                    @{ name = "🌏 Vị trí máy chủ"; value = "Asia Pacific (Singapore / Ping cực thấp ~25-40ms)"; inline = $false }
                  )
                  footer = @{ text = "Zet Store • Dịch vụ Windows RDP Asia" }
                })
              } | ConvertTo-Json -Depth 5

              $sendMsgUrl = "https://discord.com/api/v10/channels/$dmChannelId/messages"
              Invoke-RestMethod -Uri $sendMsgUrl -Method Post -Headers $authHeader -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))
              echo "Da gui thong tin RDP thanh cong vao DMs cua user!"
            }
          }

      - name: 3. Duy tri may hoat dong
        shell: powershell
        run: |
          echo "Windows RDP dang hoat dong on dinh..."
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
            echo "May RDP da hoat dong duoc $i phut..."
          }
