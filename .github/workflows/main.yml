name: All-In-One UgPhone Cloud (Direct Link)
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: false
        default: ''
      user_name:
        description: 'Discord User Name'
        required: false
        default: ''
      bot_token:
        description: 'Discord Bot Token'
        required: false
        default: ''

jobs:
  launch-cloudphone:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kich hoat phan cung KVM
        run: |
          sudo chmod 777 /dev/kvm || true
          ls -l /dev/kvm

      - name: 2. Khoi dong Android Nexus 5 (Ban goc chuan)
        run: |
          echo "Khoi dong Cloud Phone..."
          docker run -d \
            -p 6080:6080 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e EMULATOR_NO_SKIN=true \
            -e WEB_VNC=true \
            -e EMULATOR_ADDITIONAL_ARGS="-no-audio -no-boot-anim" \
            --device /dev/kvm \
            --name ugphone-container \
            budtmo/docker-android:emulator_9.0

          sleep 15
          docker ps

      - name: 3. Tao Link 1-Click & Tu dong gui truc tiep vao DMs cua User
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # Forward cong 6080
          ./cloudflared tunnel --url http://127.0.0.1:6080 > tunnel.log 2>&1 &

          echo "Dang doi Cloudflare Tunnel khoi tao..."
          TUNNEL_URL=""
          for i in {1..20}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log 2>/dev/null | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Khong lay duoc Tunnel URL!"
            exit 1
          fi

          FULL_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale"
          echo "================================================================================"
          echo "🚀 LINK 1-CLICK VAO THANG CLOUD PHONE:"
          echo "$FULL_URL"
          echo "================================================================================"

          USER_ID="${{ github.event.inputs.user_id }}"
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"

          if [ -n "$USER_ID" ] && [ -n "$BOT_TOKEN" ]; then
            echo "Dang gui link vao DM cho $USER_ID..."
            DM_RESP=$(curl -s -X POST "https://discord.com/api/v10/users/@me/channels" \
              -H "Authorization: Bot $BOT_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"recipient_id\":\"$USER_ID\"}")
            DM_CHANNEL=$(echo "$DM_RESP" | jq -r '.id // empty')

            if [ -n "$DM_CHANNEL" ] && [ "$DM_CHANNEL" != "null" ]; then
              PAYLOAD=$(jq -n \
                --arg url "$FULL_URL" \
                --arg uid "$USER_ID" \
                '{
                  embeds: [{
                    title: "🎉 CLOUD PHONE CỦA BẠN ĐÃ SẴN SÀNG!",
                    description: ("Xin chào <@" + $uid + ">!\n\nMáy ảo **Android Cloud Phone** của bạn đã khởi động thành công!\n\n📱 **Thiết bị:** Android 9.0 (Nexus 5)\n⚡ **Tốc độ:** 60 FPS • Ping thấp\n🌐 **Trạng thái:** Đang hoạt động trực tuyến\n\n👉 **Link truy cập 1-Click:**\n" + $url + "\n\n*(Nhấn vào nút bên dưới để mở ngay màn hình máy ảo trên trình duyệt web)*"),
                    color: 65280,
                    footer: { text: "Zet Store • Cloud Phone System" }
                  }],
                  components: [{
                    type: 1,
                    components: [{
                      type: 2,
                      style: 5,
                      label: "🚀 Mở Màn Hình Cloud Phone Ngay",
                      url: $url
                    }]
                  }]
                }')

              curl -s -X POST "https://discord.com/api/v10/channels/$DM_CHANNEL/messages" \
                -H "Authorization: Bot $BOT_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD"
              echo "Da gui link thanh cong vao DMs!"
            fi
          fi

      - name: 4. Duy tri may treo game
        run: |
          echo "Cloud Phone dang hoat dong on dinh..."
          for i in {1..360}; do
            sleep 60
            echo "Da treo duoc $i phut..."
          done
