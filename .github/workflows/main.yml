name: All-In-One UgPhone Cloud (Direct Link)
on:
  workflow_dispatch:

jobs:
  launch-cloudphone:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kich hoat phan cung KVM
        run: |
          sudo chmod 777 /dev/kvm || true
          ls -l /dev/kvm

      - name: 2. Khoi dong Android toi uu
        run: |
          echo "Khoi dong Cloud Phone..."
          docker run -d \
            -p 6080:6080 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e EMULATOR_NO_SKIN=true \
            -e WEB_VNC=true \
            -e SCREEN_WIDTH=720 \
            -e SCREEN_HEIGHT=1280 \
            -e EMULATOR_ADDITIONAL_ARGS="-no-audio -no-boot-anim" \
            --device /dev/kvm \
            --name ugphone-container \
            budtmo/docker-android:emulator_9.0

          sleep 15
          docker ps

      - name: 3. Tao Link 1-Click vao thang man hinh
        run: |
          # Tai Cloudflare Tunnel
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # Forward cong 6080
          ./cloudflared tunnel --url http://127.0.0.1:6080 > tunnel.log 2>&1 &

          sleep 10
          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log | head -n 1)

          echo "================================================================================"
          echo "🚀 LINK 1-CLICK VAO THANG CLOUD PHONE (BAM LA CHAY, CHIA SE DUOC CHO NGUOI KHAC):"
          echo "${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale"
          echo "================================================================================"

      - name: 4. Duy tri may treo game
        run: |
          echo "Cloud Phone dang hoat dong on dinh..."
          for i in {1..360}; do
            sleep 60
            echo "Da treo duoc $i phut..."
          done
