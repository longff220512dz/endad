name: All-In-One UgPhone Cloud
on:
  workflow_dispatch:

jobs:
  launch-cloudphone:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kich hoat phan cung KVM
        run: |
          sudo chmod 777 /dev/kvm || true
          ls -l /dev/kvm

      - name: 2. Khoi dong Android Sieu Muot (Khong vien, Giam Lag)
        run: |
          echo "Khoi dong Android Cloud Phone che do toi uu toc do..."
          # Su dung Nexus 5 nhe hon Galaxy S10 rat nhieu lan
          # EMULATOR_NO_SKIN=true: Xoa bo toan bo vo may va nut thua ben phai
          docker run -d \
            -p 6080:6080 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e EMULATOR_NO_SKIN=true \
            -e WEB_VNC=true \
            -e EMULATOR_ADDITIONAL_ARGS="-no-audio -no-boot-anim" \
            --device /dev/kvm \
            --name ugphone-container \
            budtmo/docker-android:emulator_9.0

          sleep 15
          docker ps

      - name: 3. Tao link Web Cloudflare Tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # Link noVNC truc tiep full man hinh
          ./cloudflared tunnel --url http://127.0.0.1:6080 > tunnel.log 2>&1 &

          sleep 10
          echo "=========================================================="
          echo "🚀 LINK CLOUD PHONE FULL MAN HINH (KHONG VIEN, GIAM LAG):"
          grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log | head -n 1
          echo "=========================================================="

      - name: 4. Duy tri may treo game
        run: |
          echo "Cloud Phone dang treo on dinh..."
          for i in {1..360}; do
            sleep 60
            echo "Da treo duoc $i phut..."
          done
