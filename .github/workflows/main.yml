name: All-In-One UgPhone Cloud (Direct Link)
on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Discord User ID'
        required: false
        default: ''
      user_name:
        description: 'Discord User Name'
        required: false
        default: ''
      bot_token:
        description: 'Discord Bot Token'
        required: false
        default: ''

jobs:
  launch-cloudphone:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kich hoat phan cung KVM
        run: |
          sudo chmod 777 /dev/kvm || true
          ls -l /dev/kvm

      - name: 2. Khoi dong Android Nexus 5 (Ban goc chuan)
        run: |
          echo "Khoi dong Cloud Phone..."
          docker run -d \
            -p 6080:6080 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e EMULATOR_NO_SKIN=true \
            -e WEB_VNC=true \
            -e EMULATOR_ADDITIONAL_ARGS="-no-audio -no-boot-anim" \
            --device /dev/kvm \
            --name ugphone-container \
            budtmo/docker-android:emulator_9.0

          sleep 15
          docker ps

      - name: 3. Tao Link 1-Click & Tu dong gui truc tiep vao DMs cua User
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

          # Forward cong 6080
          ./cloudflared tunnel --url http://127.0.0.1:6080 > tunnel.log 2>&1 &

          echo "Dang doi Cloudflare Tunnel khoi tao..."
          TUNNEL_URL=""
          for i in {1..20}; do
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*trycloudflare.com' tunnel.log 2>/dev/null | head -n 1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Khong lay duoc Tunnel URL!"
            exit 1
          fi

          FULL_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=scale"
          echo "================================================================================"
          echo "🚀 LINK 1-CLICK VAO THANG CLOUD PHONE:"
          echo "$FULL_URL"
          echo "================================================================================"

          export TUNNEL_URL="$TUNNEL_URL"
          export USER_ID="${{ github.event.inputs.user_id }}"
          export BOT_TOKEN="${{ github.event.inputs.bot_token }}"

          python3 - << 'EOF'
import os
import requests

user_id = os.environ.get("USER_ID", "").strip()
bot_token = os.environ.get("BOT_TOKEN", "").strip()
tunnel_url = os.environ.get("TUNNEL_URL", "").strip()

if user_id and bot_token and tunnel_url:
    full_url = f"{tunnel_url}/vnc.html?autoconnect=true&resize=scale"
    headers = {
        "Authorization": f"Bot {bot_token}",
        "Content-Type": "application/json",
        "User-Agent": "ZetStoreBot"
    }
    try:
        dm_res = requests.post(
            "https://discord.com/api/v10/users/@me/channels",
            headers=headers,
            json={"recipient_id": user_id},
            timeout=10
        )
        if dm_res.status_code in [200, 201]:
            dm_channel_id = dm_res.json().get("id")
            msg = {
                "embeds": [{
                    "title": "🎉 CLOUD PHONE CỦA BẠN ĐÃ SẴN SÀNG!",
                    "description": (
                        f"Xin chào <@{user_id}>!\n\n"
                        f"Máy ảo **Android Cloud Phone** của bạn đã khởi động hoàn tất và kết nối mạng thành công!\n\n"
                        f"📱 **Thiết bị:** Android 9.0 (Nexus 5)\n"
                        f"⚡ **Tốc độ:** 60 FPS • Ping thấp\n"
                        f"🌐 **Trạng thái:** Đang hoạt động trực tuyến\n\n"
                        f"👉 **Link truy cập 1-Click:**\n{full_url}\n\n"
                        f"*(Nhấn vào nút xanh bên dưới để vào ngay màn hình máy ảo trên trình duyệt web của bạn)*"
                    ),
                    "color": 65280,
                    "footer": {"text": "Zet Store • Cloud Phone System"}
                }],
                "components": [{
                    "type": 1,
                    "components": [{
                        "type": 2,
                        "style": 5,
                        "label": "🚀 Mở Màn Hình Cloud Phone",
                        "url": full_url
                    }]
                }]
            }
            send_res = requests.post(
                f"https://discord.com/api/v10/channels/{dm_channel_id}/messages",
                headers=headers,
                json=msg,
                timeout=10
            )
            print(f"Ket qua gui DM: {send_res.status_code}")
        else:
            print(f"Loi tao DM channel: {dm_res.status_code} {dm_res.text}")
    except Exception as e:
        print(f"Loi ngoai le khi gui DM: {e}")
EOF

      - name: 4. Duy tri may treo game
        run: |
          echo "Cloud Phone dang hoat dong on dinh..."
          for i in {1..360}; do
            sleep 60
            echo "Da treo duoc $i phut..."
          done
