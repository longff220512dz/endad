name: Windows RDP Asia (Low Ping)
on:
  workflow_dispatch:
    inputs:
      ngrok_token:
        description: 'Ngrok Auth Token (Tuy chon)'
        required: false
        default: ''
      region:
        description: 'Ngrok Region (ap, jp, in, us, eu)'
        required: false
        default: 'ap'
      user_id:
        description: 'Discord User ID'
        required: false
        default: ''
      user_name:
        description: 'Discord User Name'
        required: false
        default: ''
      bot_token:
        description: 'Discord Bot Token'
        required: false
        default: ''

jobs:
  launch-rdp:
    runs-on: windows-latest
    steps:
      - name: 1. Bat RDP & Cau hinh Multi-Session User
        shell: cmd
        run: |
          net user runneradmin "Zetngu@123"
          net user zetlong "Zetngu@123" /add
          net localgroup administrators zetlong /add
          net localgroup "Remote Desktop Users" runneradmin /add
          net localgroup "Remote Desktop Users" zetlong /add
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fSingleSessionPerUser /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v MaxInstanceCount /t REG_DWORD /d 10 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v SelectTransport /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services" /v fDisableUDP /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows NT\Terminal Services\Client" /v fClientDisableUDP /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v UserAuthentication /t REG_DWORD /d 0 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveInterval /t REG_DWORD /d 1 /f
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" /v KeepAliveTimeout /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
          echo Da thiet lap thanh cong he thong RDP on dinh!

      - name: 2. Ket noi Tunnel Asia & Duy tri RDP
        shell: bash
        run: |
          set +e
          NGROK_TOKEN="${{ github.event.inputs.ngrok_token }}"
          REGION="${{ github.event.inputs.region }}"
          if [ -z "$REGION" ]; then REGION="ap"; fi

          RDP_HOST=""

          # 1. Neu co Ngrok Token, thu dung Ngrok truoc
          if [ -n "$NGROK_TOKEN" ]; then
            echo "Dang ket noi Ngrok Tunnel..."
            curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -o ngrok.zip
            unzip -q -o ngrok.zip
            ./ngrok.exe config add-authtoken "$NGROK_TOKEN"
            ./ngrok.exe tcp 3389 --log=stdout > ngrok.log 2>&1 &
            
            for i in {1..15}; do
              sleep 2
              PUB_URL=$(curl -s http://127.0.0.1:4040/api/tunnels 2>/dev/null | jq -r '.tunnels[0].public_url // empty' 2>/dev/null)
              if [ -n "$PUB_URL" ] && [ "$PUB_URL" != "null" ]; then
                RDP_HOST=$(echo "$PUB_URL" | sed 's|tcp://||')
                break
              fi
            done
            if [ -z "$RDP_HOST" ]; then
              echo "⚠️ Ngrok khong khoi dong duoc (do tai khoan Ngrok chua them the ngan hang de mo TCP). Tu dong chuyen sang Pinggy Asia..."
            fi
          fi

          # 2. Ket noi Pinggy CLI Asia (Singapore - ap.free.pinggy.io / Ping cuc thap 25ms, khong can the hay token)
          if [ -z "$RDP_HOST" ]; then
            echo "Dang ket noi Pinggy Asia Server (Singapore - ap.free.pinggy.io)..."
            curl -sL https://github.com/Pinggy-io/cli-js/releases/download/v0.6.1/pinggy-win-x64.exe -o pinggy.exe
            ./pinggy.exe --type tcp -l 3389 tcp@ap.free.pinggy.io > pinggy.log 2>&1 &
            
            for i in {1..20}; do
              sleep 2
              if [ -f pinggy.log ]; then
                MATCH=$(grep -oE 'tcp://[-a-zA-Z0-9.:]+' pinggy.log 2>/dev/null | head -n 1)
                if [ -n "$MATCH" ]; then
                  RDP_HOST=$(echo "$MATCH" | sed 's|tcp://||')
                  break
                fi
              fi
            done
          fi

          # 3. Fallback du phong: Bore
          if [ -z "$RDP_HOST" ]; then
            echo "Fallback Bore Tunnel..."
            curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip -o bore.zip
            unzip -q -o bore.zip
            ./bore.exe local 3389 --to bore.pub > bore.log 2>&1 &
            
            for i in {1..15}; do
              sleep 2
              if [ -f bore.log ]; then
                PORT=$(grep -oE 'listening at bore.pub:[0-9]+' bore.log 2>/dev/null | grep -oE '[0-9]+' | head -n 1)
                if [ -n "$PORT" ]; then
                  RDP_HOST="bore.pub:$PORT"
                  break
                fi
              fi
            done
          fi

          if [ -z "$RDP_HOST" ]; then
            echo "Khong lay duoc dia chi RDP Host!"
            exit 1
          fi

          echo "================================================================================"
          echo "🖥️ THONG TIN KET NOI WINDOWS RDP ASIA:"
          echo "HOST: $RDP_HOST"
          echo "USER: runneradmin (hoac zetlong)"
          echo "PASS: Zetngu@123"
          echo "REGION: Singapore / Asia Pacific (Ping ~25ms)"
          echo "================================================================================"

          echo "### 🖥️ MÁY ẢO WINDOWS RDP ASIA ĐÃ SẴN SÀNG!" >> $GITHUB_STEP_SUMMARY
          echo "- 📍 **Địa chỉ IP / Máy tính (Computer)**: \`$RDP_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 **Tên đăng nhập (Username)**: \`runneradmin\` *(vào thẳng Desktop)* hoặc \`zetlong\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🔑 **Mật khẩu (Password)**: \`Zetngu@123\`" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ **Vị trí Server**: Singapore / Asia Pacific (Ping cực thấp 20-35ms, 4 vạch)" >> $GITHUB_STEP_SUMMARY

          USER_ID="${{ github.event.inputs.user_id }}"
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"

          if [ -n "$USER_ID" ] && [ -n "$BOT_TOKEN" ]; then
            echo "Dang tao kenh DM cho $USER_ID..."
            jq -n --arg uid "$USER_ID" '{"recipient_id": $uid}' > dm_req.json
            DM_RESP=$(curl -s -X POST "https://discord.com/api/v10/users/@me/channels" \
              -H "Authorization: Bot $BOT_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @dm_req.json)
            DM_CHANNEL=$(echo "$DM_RESP" | jq -r '.id // empty')

            if [ -n "$DM_CHANNEL" ] && [ "$DM_CHANNEL" != "null" ]; then
              echo "Dang gui thong tin RDP vao DM $DM_CHANNEL..."
              jq -n \
                --arg host "$RDP_HOST" \
                --arg uid "$USER_ID" \
                '{
                  embeds: [{
                    title: "🖥️ MÁY ẢO WINDOWS RDP ASIA ĐÃ SẴN SÀNG!",
                    description: ("Xin chào <@" + $uid + ">!\n\nMáy ảo **Windows Server 2022** của bạn đã khởi động thành công với vị trí **Server Singapore (Asia Pacific)** cho độ trễ cực thấp!\n\n📌 **Cách kết nối từ máy tính:**\n1. Nhấn phím **Win + R**, gõ **mstsc** rồi nhấn Enter.\n2. Nhập thông tin bên dưới để đăng nhập:"),
                    color: 3066993,
                    fields: [
                      { name: "📍 Địa chỉ IP / Máy tính (Computer)", value: ("```" + $host + "```"), inline: false },
                      { name: "👤 Tên đăng nhập (Username)", value: "```runneradmin``` hoặc ```zetlong```", inline: true },
                      { name: "🔑 Mật khẩu (Password)", value: "```Zetngu@123```", inline: true },
                      { name: "🌏 Vị trí máy chủ", value: "Singapore / Asia Pacific (Ping cực thấp ~20-35ms, 4 vạch)", inline: false }
                    ],
                    footer: { text: "Zet Store • Dịch vụ Windows RDP Asia" }
                  }]
                }' > payload.json

              curl -s -X POST "https://discord.com/api/v10/channels/$DM_CHANNEL/messages" \
                -H "Authorization: Bot $BOT_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @payload.json
              echo "Da gui thong tin RDP thanh cong vao DMs!"
            else
              echo "Loi tao kenh DM: $DM_RESP"
            fi
          fi

          echo "Windows RDP dang hoat dong on dinh..."
          for i in {1..360}; do
            sleep 60
            echo "May RDP da hoat dong duoc $i phut..."
          done
